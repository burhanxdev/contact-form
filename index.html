<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <!-- Stylesheet (CSS) Link -->
    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts (Poppins) Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <main>
      <div class="left-section">
        <span class="section-badge">Contact</span>
        <h2 class="page-heading">Let's Work Together</h2>
        <p class="page-description">
          Have a project in mind? We'd love to hear from you. <br />
          Send us a message and we'll respond as soon as <br />
          possible.
        </p>

        <div class="contact-info">
          <a href="#">
            <span class="envelope-icon">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <div class="contact-details">
              <p class="contact-label">Email</p>
              <p class="email-address">hello@example.com </p>
            </div>
          </a>
          <a href="#">
            <span class="phone-icon">
              <i class="fa-solid fa-phone"></i>
            </span>
            <div class="contact-details">
              <p class="contact-label">Phone</p>
              <p class="phone-no">+1 (234) 567-890</p>
            </div>
          </a>
          <a href="#">
            <span class="location-icon">
              <i class="fa-solid fa-location-dot"></i>
            </span>
            <div class="contact-details">
              <p class="contact-label">Office</p>
              <p class="address">123 Street, San Francisco, CA</p>
            </div>
          </a>
        </div>

        <div class="social-links-container">
          <a href="#" class="social-link">
            <i class="fa-brands fa-x-twitter"></i>
          </a>
          <a href="#" class="social-link">
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="#" class="social-link">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a href="#" class="social-link">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
      <div class="right-section">
        <form action="#">
          <h2 class="form-heading">Send a message</h2>

          <div class="name-group">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input required type="text" id="fname" placeholder="John" />
            </div>
            <div class="form-group">
              <label for="lname">Last Name</label>
              <input required type="text" id="lname" placeholder="Doe" />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              required
              type="email"
              id="email"
              placeholder="john@example.com"
            />
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select required id="subject">
              <option value="" disabled selected>Select a topic</option>
              <option value="web-design">Web Design</option>
              <option value="web-development">Web Development</option>
              <option value="branding">Branding</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              required
              id="message"
              rows="5"
              placeholder="Tell us about your project..."
            ></textarea>
          </div>

          <button class="send-btn">
            Send Message &nbsp; &nbsp;<i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
